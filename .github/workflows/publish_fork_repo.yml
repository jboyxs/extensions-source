name: Publish Fork Repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/zh/dogemanga/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
      - '.github/workflows/publish_fork_repo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-fork-repo
  cancel-in-progress: true

env:
  MODULE: :src:zh:dogemanga
  DELETE: '["zh.dogemanga"]'
  REPO_NAME: ${{ github.repository }}
  ICON_BASE_URL: https://cdn.jsdelivr.net/gh/${{ github.repository }}@main
  INDEX_NAME: Jboyxs Extensions
  BADGE_LABEL: JBX
  DEFAULT_ALIAS: upload
  DEFAULT_KEY_STORE_PASSWORD: android
  DEFAULT_KEY_PASSWORD: android

jobs:
  build:
    name: Build DogeManga
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS || env.DEFAULT_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || env.DEFAULT_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.DEFAULT_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          else
            keytool -genkeypair \
              -v \
              -keystore signingkey.jks \
              -storepass "$KEY_STORE_PASSWORD" \
              -alias "$ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=${GITHUB_REPOSITORY}, OU=GitHub Actions, O=Jboyxs, L=Unknown, ST=Unknown, C=US"
          fi

          keytool -list -v \
            -keystore signingkey.jks \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias "$ALIAS" |
            awk '/SHA256:/ { gsub(":", "", $2); print tolower($2) }' > signing-key-fingerprint.txt

      - name: Build extension
        env:
          ALIAS: ${{ secrets.ALIAS || env.DEFAULT_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || env.DEFAULT_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.DEFAULT_KEY_PASSWORD }}
        run: |
          ./gradlew "${MODULE}:assembleRelease"

      - name: Upload signing fingerprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-key-fingerprint
          path: signing-key-fingerprint.txt
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogemanga-release
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          retention-days: 1

  publish:
    name: Publish repo branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ~/apk-artifacts

      - name: Read signing fingerprint
        run: |
          fingerprint="$(cat ~/apk-artifacts/signing-key-fingerprint/signing-key-fingerprint.txt)"
          echo "SIGNING_KEY_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Checkout or initialize repo branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir repo
          cd repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch origin repo; then
            git checkout repo
          else
            git checkout --orphan repo
            printf '{"name":"%s","badgeLabel":"%s","signingKey":"%s","contact":{},"extensionList":{"extensions":[]}}\n' \
              "$INDEX_NAME" \
              "$BADGE_LABEL" \
              "${SIGNING_KEY_FINGERPRINT:-}" > index.json
            printf '{}\n' > release-assets.json
          fi

      - name: Publish extension index
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd repo
          pip install protobuf
          python -u ../main/.github/scripts/publish-repo.py "$DELETE" "$GITHUB_SHA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update extension repo"
            git push origin repo
          else
            echo "No changes to commit"
          fi
